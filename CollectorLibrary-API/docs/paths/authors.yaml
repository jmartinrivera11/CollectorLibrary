post:
  summary: Create a new author
  tags: [Authors]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            birth_year:
              type: string
              nullable: true
            nationality:
              type: string
              nullable: true
          example:
            first_name: "Ernest"
            last_name: "Hemingway"
            birth_year: "1899"
  responses:
    "201":
      description: Autor creado con éxito
      content:
        application/json:
          example:
            status: 201
            data:
              id: 1
              first_name: "Ernest"
              last_name: "Hemingway"
              birth_year: "1899"
              nationality: "American"
    "406":
      description: No se recibieron datos válidos
      content:
        application/json:
          example:
            status: 406
            message: "No se recibieron datos válidos"
    "500":
      description: Error interno del servidor
      content:
        application/json:
          example:
            status: 500
            message: "Error interno del servidor"